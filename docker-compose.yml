
services:
  figcraft-server:
    image: oxxywhite/figcraft-server:latest

    restart: unless-stopped
    stop_grace_period: 30s

    command:
      - --listen
      - 0.0.0.0:47900
      - --data
      - /data
      - --public-url
      - ${FIGCRAFT_PUBLIC_URL}

    ports:
      - "47900:47900"

    volumes:
      - figcraft-data:/data
      - ./server.toml:/etc/figcraft-server/server.toml:ro

volumes:
  figcraft-data:
    name: figcraft-server-data
